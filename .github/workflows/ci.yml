name: CI

on:
  # No branch filter on pull_request: this repository's default branch is
  # not called "main", so `branches: [main]` meant no workflow had ever run
  # on any commit or pull request. Firing on every PR regardless of base
  # keeps working if the default branch is renamed again.
  pull_request:
  push:
    branches-ignore:
      - "dependabot/**"

# A PR branch triggers both `push` and `pull_request`; this collapses them
# into one run and cancels superseded runs on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check dockerls/ tests/
      - run: ruff format --check dockerls/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m mypy dockerls/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov=dockerls --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml
