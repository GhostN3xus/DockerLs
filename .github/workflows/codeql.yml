name: CodeQL

on:
  # No branch filter on pull_request: this repository's default branch is
  # not called "main", so `branches: [main]` meant no workflow had ever run
  # on any commit or pull request. Firing on every PR regardless of base
  # keeps working if the default branch is renamed again.
  pull_request:
  push:
    branches-ignore:
      - "dependabot/**"
  schedule:
    - cron: "0 8 * * 1"

# A PR branch triggers both `push` and `pull_request`; this collapses them
# into one run and cancels superseded runs on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
