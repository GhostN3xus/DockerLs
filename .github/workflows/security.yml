name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      # Full report for the artifact, all severities included. --exit-zero is
      # deliberate here: this step only produces the report, the gate below
      # decides whether the job fails.
      - name: Bandit report (all severities)
        run: bandit -r dockerls/ -c pyproject.toml -f json -o bandit-report.json --exit-zero
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
      # The actual gate: MEDIUM and HIGH findings fail the job, LOW stays
      # informational (see the report artifact above).
      - name: Fail on MEDIUM+ findings
        run: bandit -r dockerls/ -c pyproject.toml --severity-level medium

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip-audit

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t dockerls:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dockerls:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
