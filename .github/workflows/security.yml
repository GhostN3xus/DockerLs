name: Security

on:
  # No branch filter on pull_request: this repository's default branch is
  # not called "main", so `branches: [main]` meant no workflow had ever run
  # on any commit or pull request. Firing on every PR regardless of base
  # keeps working if the default branch is renamed again.
  pull_request:
  push:
    branches-ignore:
      - "dependabot/**"
  schedule:
    - cron: "0 6 * * 1"

# A PR branch triggers both `push` and `pull_request`; this collapses them
# into one run and cancels superseded runs on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r dockerls/ -c pyproject.toml -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip-audit

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t dockerls:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dockerls:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
